[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  # Python function ko zyada time do (PDF generation me 20-40 sec lag sakta hai)
  [functions."generate-kundali"]
    timeout = 60

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
